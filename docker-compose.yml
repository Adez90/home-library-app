# Production stack. Requires a `.env` file next to this one (see .env.example) with real
# secrets — POSTGRES_PASSWORD and JWT_SECRET are required and have no insecure default.
# For local development, use docker-compose.dev.yml instead (see README).
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: library
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env — see .env.example}
      POSTGRES_DB: library
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U library"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://library:${POSTGRES_PASSWORD}@db:5432/library
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env — see .env.example}
      REGISTRATION_SECRET: ${REGISTRATION_SECRET:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      NODE_ENV: production
      PORT: 3000

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
      args:
        VITE_SENTRY_DSN: ${VITE_SENTRY_DSN:-}
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "127.0.0.1:8080:80"

volumes:
  db-data:
