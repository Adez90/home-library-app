name: web-ci

on:
  push:
    paths:
      - "web/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/web-ci.yml"
  pull_request:
    paths:
      - "web/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/web-ci.yml"

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm install
      - run: npx tsc -b web
      - run: npm test --workspace web
      - run: npm run build --workspace web
