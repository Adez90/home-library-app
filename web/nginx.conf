server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 127.0.0.11 is Docker Compose's embedded DNS. A plain `proxy_pass http://api:3000/`
    # resolves once at nginx startup and caches that IP for the worker's lifetime — if `api`
    # is later redeployed on its own (a new container, a new IP) without also restarting
    # `web`, every request starts 502ing until someone notices and restarts nginx too. Routing
    # through a variable forces nginx to re-resolve via this resolver (with the given TTL)
    # instead of caching indefinitely.
    resolver 127.0.0.11 valid=10s;

    location /api/ {
        set $api_upstream api:3000;
        proxy_pass http://$api_upstream/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri /index.html;
    }
}
